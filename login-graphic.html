<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wisemonk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-700:#1E33C4;
    --blue-600:#2C43E8;
    --blue-500:#4459F0;
    --sky-100:#DDE9FE;
    --violet-100:#E9E3FB;
    --violet-200:#DCD1F7;

    --ink-900:#0F1424;
    --ink-600:#4A5163;
    --ink-400:#767D90;
    --line:#E5E8F0;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  :root{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink-900);
    background:linear-gradient(142deg,var(--sky-100) 0%,var(--violet-100) 52%,var(--violet-200) 100%);
    -webkit-font-smoothing:antialiased;
  }
  body::before,body::after{
    content:"";position:fixed;pointer-events:none;z-index:0;
    border-radius:50%;filter:blur(90px);
  }
  body::before{
    width:52vw;height:52vw;top:-16vw;left:-12vw;
    background:radial-gradient(circle,rgba(199,216,254,.95),rgba(199,216,254,0) 70%);
  }
  body::after{
    width:46vw;height:46vw;bottom:-18vw;right:-10vw;
    background:radial-gradient(circle,rgba(220,209,247,.9),rgba(220,209,247,0) 70%);
  }

  .page{
    position:relative;z-index:1;
    min-height:100%;
    display:grid;place-items:stretch;
    padding:0;
  }

  /* ---------- staged composition ---------- */
  .brand-side{
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    width:100%;max-width:none;
  }

  .stage{
    position:relative;width:100%;min-height:100vh;
    display:flex;flex-direction:column;justify-content:flex-start;align-items:center;
    border-radius:0;
    padding:52px 30px 40px;
    overflow:hidden;
    background:linear-gradient(150deg,rgba(255,255,255,.52),rgba(255,255,255,.3));
    border:1px solid rgba(255,255,255,.72);
    backdrop-filter:blur(20px) saturate(1.5);
    -webkit-backdrop-filter:blur(20px) saturate(1.5);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.85),
      0 26px 64px -26px rgba(37,52,120,.26);
  }
  .stage::before,.stage::after{
    content:"";position:absolute;pointer-events:none;
    border-radius:50%;filter:blur(54px);
  }
  .stage::before{
    width:290px;height:290px;top:-104px;right:-76px;
    background:radial-gradient(circle,rgba(124,152,250,.55),rgba(124,152,250,0) 70%);
  }
  .stage::after{
    width:310px;height:310px;bottom:-130px;left:-86px;
    background:radial-gradient(circle,rgba(178,150,238,.5),rgba(178,150,238,0) 70%);
  }

  .stage-inner{position:relative;z-index:1;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;}

  .stage-head{text-align:center;max-width:none;margin:0 auto 10px;}
  .stage-head h2{
    margin:0 0 10px;font-size:clamp(24px,3.4vw,44px);line-height:1.14;white-space:nowrap;
    font-weight:700;letter-spacing:-.025em;color:#141B2E;
  }
  .stage-head h2 span{color:#7C63DC;}

  /* Rotating testimonial pinned near the bottom of the panel. */
  .testi{
    position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
    width:86%;max-width:440px;text-align:center;z-index:3;
  }
  .testi-line{
    font-size:13.5px;line-height:1.55;color:var(--ink-600);
    transition:opacity .45s ease;display:inline-block;
  }
  .stage-head p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-600);}

  /* ---------- composition ---------- */
  .showcase{
    position:relative;
    width:710px;
    height:680px;
    margin:auto;
  }

  .feed-icons{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:center;gap:42px;
    z-index:2;
  }
  .side{
    position:absolute;top:170px;
    display:flex;flex-direction:column;gap:24px;
    z-index:2;
  }
  .side-l{left:56px;}
  .side-r{right:56px;}

  .feed-tile{
    position:relative;overflow:hidden;
    width:64px;height:64px;border-radius:19px;flex:none;
    display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.01));
    backdrop-filter:blur(24px) saturate(2.1);
    -webkit-backdrop-filter:blur(24px) saturate(2.1);
    border:1px solid rgba(255,255,255,.32);
    box-shadow:
      inset 0 1.5px 1px rgba(255,255,255,.6),
      inset 0 -1.5px 2px rgba(118,128,190,.16),
      0 12px 24px -16px rgba(37,52,120,.18);
    color:var(--blue-600);
    animation:float-in .6s cubic-bezier(.22,.8,.3,1) both;
  }
  .feed-tile::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(142deg,
      rgba(255,255,255,.3) 0%,
      rgba(255,255,255,.06) 34%,
      rgba(255,255,255,0) 52%);
  }
  .feed-tile::after{
    content:"";position:absolute;pointer-events:none;
    left:16%;right:16%;bottom:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  }
  .feed-tile svg{position:relative;z-index:1;}
  .feed-tile:nth-child(1){animation-delay:.05s;}
  .feed-tile:nth-child(2){animation-delay:.14s;}
  .feed-tile:nth-child(3){animation-delay:.23s;}

  .feed-tile img{
    position:relative;z-index:1;
    width:32px;height:32px;
    object-fit:contain;display:block;
  }
  .feed-icons .feed-tile:nth-child(1){animation-delay:.05s;}
  .feed-icons .feed-tile:nth-child(2){animation-delay:.12s;}
  .feed-icons .feed-tile:nth-child(3){animation-delay:.19s;}
  .side-l .feed-tile:nth-child(1){animation-delay:.26s;}
  .side-l .feed-tile:nth-child(2){animation-delay:.33s;}
  .side-l .feed-tile:nth-child(3){animation-delay:.40s;}
  .side-r .feed-tile:nth-child(1){animation-delay:.30s;}
  .side-r .feed-tile:nth-child(2){animation-delay:.37s;}
  .side-r .feed-tile:nth-child(3){animation-delay:.44s;}

  /* ---------- wires ---------- */
  .wires{position:absolute;inset:0;width:100%;height:100%;z-index:1;}
  .wires path{
    fill:none;stroke:url(#wireStroke);
    stroke-width:1.4;stroke-linecap:round;
    stroke-dasharray:320;stroke-dashoffset:320;
    animation:draw 1.5s .45s cubic-bezier(.3,.7,.3,1) forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0;}}

  /* travelling light — must outrank `.wires path`; pulses are paths 13-24 */
  .wires path.feed-pulse{
    stroke:#fff;stroke-width:2.2;
    stroke-dasharray:16 420;stroke-dashoffset:436;
    opacity:.95;
    animation:flow 3.1s linear infinite;
  }
  @keyframes flow{from{stroke-dashoffset:436;}to{stroke-dashoffset:0;}}
  .wires path.feed-pulse:nth-of-type(21){animation-delay:0s;}
  .wires path.feed-pulse:nth-of-type(21){animation-delay:1.9s;}
  .wires path.feed-pulse:nth-of-type(21){animation-delay:.9s;}
  .wires path.feed-pulse:nth-of-type(21){animation-delay:2.4s;}
  .wires path.feed-pulse:nth-of-type(21){animation-delay:.45s;}
  .wires path.feed-pulse:nth-of-type(21){animation-delay:1.4s;}
  .wires path.feed-pulse:nth-of-type(21){animation-delay:2.7s;}
  .wires path.feed-pulse:nth-of-type(21){animation-delay:.7s;}
  .wires path.feed-pulse:nth-of-type(21){animation-delay:2.1s;}
  /* the one output wire runs on its own, slower rhythm */
  .wires path.feed-pulse:nth-of-type(22),
  .wires path.feed-pulse:nth-of-type(23),
  .wires path.feed-pulse:nth-of-type(24){
    stroke-dasharray:12 180;stroke-dashoffset:192;
    animation:flow-out 2.6s ease-in-out infinite;
  }
  .wires path.feed-pulse:nth-of-type(22){animation-delay:1.2s;}
  .wires path.feed-pulse:nth-of-type(23){animation-delay:1.75s;}
  .wires path.feed-pulse:nth-of-type(24){animation-delay:2.3s;}
  @keyframes flow-out{
    0%{stroke-dashoffset:192;}
    60%,100%{stroke-dashoffset:0;}
  }

  /* ---------- outcome ---------- */
  .outcome{
    position:absolute;left:50%;
    top:436px;
    transform:translateX(-50%);
    display:flex;align-items:center;gap:9px;
    padding:9px 18px;border-radius:999px;
    white-space:nowrap;
    background:linear-gradient(145deg,rgba(255,255,255,.6),rgba(255,255,255,.24));
    backdrop-filter:blur(18px) saturate(1.7);
    -webkit-backdrop-filter:blur(18px) saturate(1.7);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      0 12px 28px -12px rgba(60,45,150,.4);
    font-size:12.5px;font-weight:500;color:var(--ink-600);
    letter-spacing:-.005em;
    z-index:3;
    animation:out-in .7s 1.5s cubic-bezier(.22,.8,.3,1) both;
  }
  .outcome-2{top:509px;animation-delay:2s;}
  .outcome-3{top:582px;animation-delay:2.5s;}
  @keyframes out-in{
    from{opacity:0;transform:translate(-50%,10px);}
    to{opacity:1;transform:translateX(-50%);}
  }
  .outcome b{color:var(--ink-900);font-weight:600;}
  .outcome-dot{
    width:7px;height:7px;border-radius:50%;flex:none;background:#7C63DC;
    box-shadow:0 0 0 3px rgba(124,99,220,.2);
    animation:ping 2.4s ease-in-out infinite;
  }
  @keyframes ping{
    0%,100%{box-shadow:0 0 0 3px rgba(124,99,220,.2);}
    50%{box-shadow:0 0 0 6px rgba(124,99,220,.08);}
  }

  /* ---------- the orb ---------- */
  .orb{
    position:absolute;left:50%;top:210px;
    transform:translateX(-50%);
    width:160px;height:160px;border-radius:50%;
    display:grid;place-items:center;
    z-index:3;
    animation:orb-in .8s .35s cubic-bezier(.22,.8,.3,1) both;
  }
  @keyframes orb-in{
    from{opacity:0;transform:translateX(-50%) scale(.88);}
    to{opacity:1;transform:translateX(-50%) scale(1);}
  }
  .orb::before,.orb::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    pointer-events:none;
  }
  .orb::before{
    box-shadow:0 0 0 12px rgba(124,99,220,.13),0 0 0 26px rgba(124,99,220,.07);
    animation:halo 3.6s ease-in-out infinite;
  }
  .orb::after{
    background:radial-gradient(circle,rgba(140,118,235,.45),rgba(140,118,235,0) 68%);
    transform:scale(2);filter:blur(22px);
    animation:halo 3.6s ease-in-out infinite reverse;
  }
  @keyframes halo{0%,100%{opacity:.75;}50%{opacity:1;}}

  .orb-core{
    position:relative;z-index:1;
    width:100%;height:100%;border-radius:50%;
    display:grid;place-items:center;
    background:
      radial-gradient(circle at 32% 26%,rgba(255,255,255,.55),rgba(255,255,255,0) 45%),
      linear-gradient(150deg,#9FAEF8 0%,#7C63DC 52%,#5B45C0 100%);
    box-shadow:
      inset 0 2px 6px rgba(255,255,255,.5),
      inset 0 -8px 18px rgba(50,34,120,.35),
      0 20px 44px -12px rgba(78,58,176,.6);
  }
  .orb-core img{width:74px;height:auto;display:block;}

  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .stage,.orb-core,.feed-tile{background:rgba(255,255,255,.9);}
  }

  /* ---------- responsive ---------- */
  @media (max-width:1180px){
    .stage{padding:40px 16px;}
    .showcase{zoom:.80;}
  }
  @media (max-width:760px){
    .stage{padding:32px 10px;}
    .showcase{zoom:.62;}
  }
  @media (max-width:430px){
    .stage{background:none;border:0;box-shadow:none;backdrop-filter:none;}
    .stage::before,.stage::after{display:none;}
    .showcase{display:none;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
    .orb{opacity:1;transform:translateX(-50%);}
    .outcome{opacity:1;transform:translateX(-50%);}
    .feed-tile{opacity:1;transform:none;}
    .wires path{stroke-dashoffset:0;}
    .wires path.feed-pulse{display:none;}
  }
</style>
</head>
